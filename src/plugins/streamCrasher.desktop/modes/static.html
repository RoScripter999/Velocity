<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="guh"></canvas>
    <script>
        const canvas = document.getElementById("guh");
        const ctx = canvas.getContext("2d");
        canvas.width = 320;
        canvas.height = 180;
        const img = ctx.createImageData(canvas.width, canvas.height);
        const data = img.data;
        function draw() {
            for (let i = 0; i < data.length; i += 4) {
                const v = Math.random() * 255 | 0;
                data[i] = data[i + 1] = data[i + 2] = v;
                data[i + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
